<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nat Almighty</title>
    <link href="styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&family=Bangers&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Top part: the "heaven" -->
    <div class="top-container">
      <img class="web-left" src="./images/spider-web.png" alt="spider web">
      <img class="web-right" src="./images/spider-web-2.png" alt="spider web">
      <img class="spider-left" src="./images/hanging-spider.png" alt="hanging spider">
      <img class="spider-right" src="./images/hanging-spider.png" alt="hanging spider">
      <img class="top-cloud" src="./images/cloud.png" alt="cloud">
      <h1>Nat Almighty</h1>
      <h2 class="subtitle">with great power comes great naps.</h2>
      <img class="bottom-cloud" src="./images/cloud.png" alt="cloud">
    </div>

    <!-- Middle part: about me, hobbies, contact -->
    <div class="middle-container">
      <div class="profile">
        <h2>yo yo whatsup, welcome to my channel</h2>
        <h2 class="subscribe">👍 like and subscribe 🔔</h2>
      </div>

      <hr>

      <div class="skills">
        <h2 class="hobbies-title">My Hobbies</h2>
        <div class="parent">
          <div>
            <img class="hobby-img" src="./images/terry3.jpg" alt="my dog looking at a plate of knafeh">
          </div>
          <div>
            <h3>Petting my dog</h3>
          </div>

          <div>
            <img class="hobby-img" src="./images/doom-scrolling.png" alt="comic of a bird scrolling on a phone">
          </div>
          <div>
            <h3>Doom scrolling</h3>
          </div>

          <div>
            <img class="hobby-img" src="./images/menapping.jpg" alt="me napping on a plane">
          </div>
          <div>
            <h3>Napping</h3>
          </div>

          <div>
            <img class="small-img" src="./images/terry2.jpg" alt="my dog on an escalator">
            <img class="small-img" src="./images/terry1.jpg" alt="my dog at the beach">
          </div>
          <div>
            <h3>Hanging out with my dog</h3>
          </div>
        </div>
      </div>

      <div class="contact-me">
        <h2>Get In Touch</h2>
        <p class="hours">not before 15 pm, not after 15 pm</p>
      </div>
    </div>

    <!-- Bottom part: footer -->
    <div class="bottom-container">
      <p class="copyright">© Nat Almighty.</p>
    </div>
  </body>
</html>
